name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Build APK
        working-directory: mjafari-ows
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mjafari-ows-apk
          path: mjafari-ows/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
